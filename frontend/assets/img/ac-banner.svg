<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 110" preserveAspectRatio="xMaxYMin meet" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf1fd"/>
      <stop offset="1" stop-color="#f7faff"/>
    </linearGradient>
    <linearGradient id="louver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a7bc4"/>
      <stop offset="1" stop-color="#2a4f8c"/>
    </linearGradient>
  </defs>

  <!-- soft rounded shape on the left edge -->
  <ellipse cx="55" cy="35" rx="70" ry="85" fill="#d3e2f9" opacity=".75"/>

  <!-- unit body -->
  <rect x="45" y="-30" width="440" height="125" rx="22" fill="url(#body)"/>

  <!-- side panels -->
  <rect x="425" y="-30" width="18" height="140" fill="#d3e2f9" opacity=".6"/>
  <rect x="455" y="-30" width="8"  height="140" fill="#d3e2f9" opacity=".5"/>

  <!-- air vent slits -->
  <rect x="115" y="36" width="34" height="3" rx="1.5" fill="#b9d0f3"/>
  <rect x="230" y="36" width="30" height="3" rx="1.5" fill="#b9d0f3"/>

  <!-- louver (dark blue bar) -->
  <path d="M115 56 H370 L364 80 Q363 84 358 84 H126 Q121 84 119 79 Z" fill="url(#louver)"/>
  <rect x="115" y="56" width="255" height="3" fill="#8fb1e6" opacity=".8"/>
</svg>
